<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Cleaner</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#eef2f9;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;
    background:linear-gradient(160deg,#f7f9ff 0%,#eef3ff 45%,#f6f1ff 100%)}

  /* ---------- animated light background ---------- */
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.75;will-change:transform}
  .b1{width:760px;height:760px;background:#cfe1ff;left:-220px;top:-160px;animation:drift1 14s ease-in-out infinite}
  .b2{width:680px;height:680px;background:#e7dcff;right:-240px;top:520px;animation:drift2 17s ease-in-out infinite}
  .b3{width:720px;height:720px;background:#d4f4ea;left:-160px;bottom:-200px;animation:drift3 15s ease-in-out infinite}
  .b4{width:520px;height:520px;background:#ffe2ec;right:-80px;bottom:120px;animation:drift1 19s ease-in-out infinite reverse}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(160px,140px) scale(1.15)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-180px,-120px) scale(.9)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(200px,-160px) scale(1.1)}}
  .bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,rgba(255,255,255,.55) 35%,rgba(180,200,255,.18) 70%,transparent 72%);
    border:2px solid rgba(255,255,255,.7);animation:rise linear infinite;opacity:0}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.9}50%{transform:translateY(-1100px) translateX(40px)}90%{opacity:.8}100%{transform:translateY(-2200px) translateX(-30px);opacity:0}}

  /* ---------- screens ---------- */
  .screen{position:absolute;inset:0;transition:opacity .7s ease,transform .7s ease}
  .screen.hidden{opacity:0;pointer-events:none}
  #s1.out{opacity:0;transform:scale(.94)}
  #s2{transform:scale(1.04)}
  #s2.show{opacity:1;transform:scale(1)}

  /* ---------- notification cards ---------- */
  .card{position:absolute;left:80px;width:920px;height:420px;border-radius:56px;
    background:rgba(255,255,255,.82);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
    box-shadow:0 30px 70px rgba(60,80,140,.14),0 4px 14px rgba(60,80,140,.08),inset 0 0 0 2px rgba(255,255,255,.9);
    opacity:0;transform:translateY(-120px) scale(.96)}
  .card.in{animation:dropIn .7s cubic-bezier(.2,1.3,.4,1) forwards}
  @keyframes dropIn{0%{opacity:0;transform:translateY(-120px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .card.alert::after{content:"";position:absolute;inset:-3px;border-radius:59px;border:4px solid rgba(239,68,68,.55);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.15}50%{opacity:1}}
  .card.done{transition:transform .5s ease,opacity .5s ease}
  .card.done::after{display:none}
  .card .shake{animation:shake .5s ease 1}
  .card.in .row{animation:shake .45s .7s ease 1}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
  .row{position:absolute;left:52px;top:50px;right:52px;height:150px;display:flex;align-items:center;gap:40px}
  .icon{position:relative;flex:0 0 150px;height:150px;border-radius:40px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 28px rgba(40,60,120,.18)}
  .icon svg{width:92px;height:92px}
  .badge{position:absolute;right:-14px;top:-14px;width:58px;height:58px;border-radius:50%;background:#ef4444;
    box-shadow:0 0 0 6px #fff,0 6px 14px rgba(239,68,68,.5);display:flex;align-items:center;justify-content:center;transition:background .3s}
  .badge svg{width:34px;height:34px}
  .badge .ok{display:none}
  .card.done .badge{background:#22c55e;box-shadow:0 0 0 6px #fff,0 6px 14px rgba(34,197,94,.5)}
  .card.done .badge .warn{display:none}
  .card.done .badge .ok{display:block}
  .txt{flex:1;min-width:0}
  .t1{font-size:54px;font-weight:800;color:#0f172a;letter-spacing:-.5px}
  .t2{margin-top:10px;font-size:40px;font-weight:600;color:#ef4444;display:flex;align-items:center;gap:14px;transition:color .3s}
  .t2 .dot{width:18px;height:18px;border-radius:50%;background:currentColor;box-shadow:0 0 0 6px rgba(239,68,68,.18)}
  .card.done .t2{color:#16a34a}
  .card.done .t2 .dot{box-shadow:0 0 0 6px rgba(34,197,94,.18)}
  .btn{position:absolute;left:52px;right:52px;bottom:48px;height:132px;border-radius:66px;overflow:hidden;
    background:linear-gradient(180deg,#4f8cff 0%,#2563eb 100%);color:#fff;font-size:54px;font-weight:800;letter-spacing:.5px;
    display:flex;align-items:center;justify-content:center;gap:18px;
    box-shadow:0 16px 34px rgba(37,99,235,.38),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .12s ease,background .35s ease,box-shadow .35s}
  .btn.press{transform:scale(.95)}
  .btn .ck{display:none;width:70px;height:70px}
  .card.done .btn{background:linear-gradient(180deg,#34d67a 0%,#16a34a 100%);box-shadow:0 16px 34px rgba(22,163,74,.35),inset 0 2px 0 rgba(255,255,255,.35)}
  .card.done .btn .lbl{display:none}
  .card.done .btn .ck{display:block}
  .btn::before{content:"";position:absolute;top:0;bottom:0;width:180px;left:-220px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.4s ease-in-out infinite}
  @keyframes shine{0%{left:-220px}60%,100%{left:1000px}}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);width:40px;height:40px;margin:-20px 0 0 -20px;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
  @keyframes rip{to{transform:scale(28);opacity:0}}

  /* ---------- hand ---------- */
  #hand{position:absolute;left:0;top:0;width:326px;height:372px;z-index:50;pointer-events:none;
    transition:transform .75s cubic-bezier(.45,.05,.25,1);filter:drop-shadow(0 24px 30px rgba(40,50,90,.25))}
  #hand .inner{width:100%;height:100%;transform-origin:15% 3%;transition:transform .12s ease}
  #hand.tap .inner{transform:scale(.94) translateY(6px)}
  #hand img,#hand svg{width:100%;height:100%;display:block}

  /* ---------- trash scene ---------- */
  #trash{position:absolute;inset:0;width:1080px;height:1920px}
</style>
</head>
<body>
<div id="wrap">
<div class="stage" id="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div id="bubbles"></div>

  <!-- ===== SCREEN 1: notifications ===== -->
  <div class="screen" id="s1">
    <div class="card" id="c0" style="top:300px">
      <div class="row">
        <div class="icon" style="background:linear-gradient(160deg,#5eb0ff,#2f6df6)">
          <svg viewBox="0 0 64 64"><path d="M8 18a6 6 0 0 1 6-6h12l6 6h18a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z" fill="#fff" opacity=".95"/><path d="M32 26v14m-7-7 7 7 7-7" stroke="#2f6df6" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="badge"><svg class="warn" viewBox="0 0 24 24"><path d="M12 5v9" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><circle cx="12" cy="19" r="2" fill="#fff"/></svg><svg class="ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>
        <div class="txt"><div class="t1">Downloads</div><div class="t2"><span class="dot"></span><span class="st">3 infected files</span></div></div>
      </div>
      <div class="btn"><span class="lbl">Clean</span><svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>

    <div class="card" id="c1" style="top:760px">
      <div class="row">
        <div class="icon" style="background:linear-gradient(160deg,#ffb54d,#ff7a1a)">
          <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="#fff" stroke-width="4.5"/><ellipse cx="32" cy="32" rx="9" ry="22" fill="none" stroke="#fff" stroke-width="4"/><path d="M11 32h42M14 21h36M14 43h36" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
          <div class="badge"><svg class="warn" viewBox="0 0 24 24"><path d="M12 5v9" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><circle cx="12" cy="19" r="2" fill="#fff"/></svg><svg class="ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>
        <div class="txt"><div class="t1">Browser</div><div class="t2"><span class="dot"></span><span class="st">Malware detected</span></div></div>
      </div>
      <div class="btn"><span class="lbl">Clean</span><svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>

    <div class="card" id="c2" style="top:1220px">
      <div class="row">
        <div class="icon" style="background:linear-gradient(160deg,#b57bff,#7c3aed)">
          <svg viewBox="0 0 64 64"><path d="M20 44h26a10 10 0 0 0 1-19.9A14 14 0 0 0 20.3 26 9 9 0 0 0 20 44z" fill="#fff"/><circle cx="27" cy="35" r="3" fill="#7c3aed"/><circle cx="39" cy="35" r="3" fill="#7c3aed"/></svg>
          <div class="badge"><svg class="warn" viewBox="0 0 24 24"><path d="M12 5v9" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><circle cx="12" cy="19" r="2" fill="#fff"/></svg><svg class="ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>
        <div class="txt"><div class="t1">Cloudly</div><div class="t2"><span class="dot"></span><span class="st">Trojan detected</span></div></div>
      </div>
      <div class="btn"><span class="lbl">Clean</span><svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
  </div>

  <!-- ===== SCREEN 2: trash can ===== -->
  <div class="screen hidden" id="s2">
    <svg id="trash" viewBox="0 0 1080 1920">
      <defs>
        <!-- metal body -->
        <linearGradient id="metal" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#0d1014"/>
          <stop offset=".08" stop-color="#2a3039"/>
          <stop offset=".22" stop-color="#5d6773"/>
          <stop offset=".3" stop-color="#9aa5b2"/>
          <stop offset=".36" stop-color="#5a636e"/>
          <stop offset=".55" stop-color="#262c34"/>
          <stop offset=".72" stop-color="#3b434d"/>
          <stop offset=".8" stop-color="#6e7884"/>
          <stop offset=".88" stop-color="#2c333b"/>
          <stop offset="1" stop-color="#0a0c0f"/>
        </linearGradient>
        <linearGradient id="metalV" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
          <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".35"/>
        </linearGradient>
        <linearGradient id="rimG" x1="0" x2="1">
          <stop offset="0" stop-color="#1a1e24"/>
          <stop offset=".25" stop-color="#8f9aa7"/>
          <stop offset=".32" stop-color="#e1e7ee"/>
          <stop offset=".42" stop-color="#6b7581"/>
          <stop offset=".7" stop-color="#3a424c"/>
          <stop offset=".82" stop-color="#9aa4b0"/>
          <stop offset="1" stop-color="#15181d"/>
        </linearGradient>
        <radialGradient id="inside" cx=".5" cy=".35" r=".7">
          <stop offset="0" stop-color="#05070a"/>
          <stop offset=".7" stop-color="#11151a"/>
          <stop offset="1" stop-color="#2a3038"/>
        </radialGradient>
        <linearGradient id="lidG" x1="0" x2="1">
          <stop offset="0" stop-color="#14181d"/>
          <stop offset=".2" stop-color="#4b545f"/>
          <stop offset=".33" stop-color="#b9c3cf"/>
          <stop offset=".42" stop-color="#58616c"/>
          <stop offset=".66" stop-color="#262c33"/>
          <stop offset=".8" stop-color="#5e6874"/>
          <stop offset="1" stop-color="#101317"/>
        </linearGradient>
        <linearGradient id="lidTop" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="shadowG"><stop offset="0" stop-color="#2b3550" stop-opacity=".38"/><stop offset="1" stop-color="#2b3550" stop-opacity="0"/></radialGradient>
        <!-- virus -->
        <radialGradient id="vG1" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#d9ff8a"/><stop offset=".45" stop-color="#6fd43a"/><stop offset="1" stop-color="#1f7a24"/></radialGradient>
        <radialGradient id="vG2" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffb1c8"/><stop offset=".45" stop-color="#ff4d7a"/><stop offset="1" stop-color="#a3123f"/></radialGradient>
        <radialGradient id="vG3" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#e6c9ff"/><stop offset=".45" stop-color="#a35cff"/><stop offset="1" stop-color="#5419b0"/></radialGradient>
        <radialGradient id="paperG" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#eef1f6"/><stop offset="1" stop-color="#c3cad6"/></radialGradient>
        <radialGradient id="sparkG"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <clipPath id="bodyClip"><path d="M300 960 A240 50 0 0 0 780 960 L736 1480 A196 40 0 0 1 344 1480 Z"/></clipPath>
      </defs>

      <!-- floor shadow -->
      <ellipse id="floorShadow" cx="540" cy="1500" rx="300" ry="54" fill="url(#shadowG)"/>

      <g id="bin">
        <!-- opening (interior) + back rim -->
        <ellipse cx="540" cy="960" rx="240" ry="50" fill="url(#inside)"/>
        <path d="M300 960 A240 50 0 0 1 780 960" fill="none" stroke="url(#rimG)" stroke-width="14"/>
        <ellipse cx="540" cy="975" rx="214" ry="36" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="10"/>

        <!-- items layer (falls behind front body) -->
        <g id="items"></g>

        <!-- front body -->
        <path d="M300 960 A240 50 0 0 0 780 960 L736 1480 A196 40 0 0 1 344 1480 Z" fill="url(#metal)"/>
        <g clip-path="url(#bodyClip)">
          <path d="M300 960 A240 50 0 0 0 780 960 L736 1480 A196 40 0 0 1 344 1480 Z" fill="url(#metalV)"/>
          <!-- ribs -->
          <g id="ribs"></g>
          <!-- reinforcing bands -->
          <path d="M306 1050 A236 48 0 0 0 774 1050" fill="none" stroke="#06080a" stroke-opacity=".55" stroke-width="10"/>
          <path d="M306 1056 A236 48 0 0 0 774 1056" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="4"/>
          <path d="M340 1400 A200 42 0 0 0 740 1400" fill="none" stroke="#06080a" stroke-opacity=".55" stroke-width="12"/>
          <path d="M340 1407 A200 42 0 0 0 740 1407" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="4"/>
          <!-- specular streaks -->
          <path d="M392 990 L420 1490" stroke="#fff" stroke-opacity=".22" stroke-width="22" stroke-linecap="round"/>
          <path d="M432 996 L448 1490" stroke="#fff" stroke-opacity=".10" stroke-width="8"/>
          <path d="M690 990 L668 1490" stroke="#fff" stroke-opacity=".08" stroke-width="14"/>
        </g>
        <!-- bottom base ring -->
        <path d="M344 1480 A196 40 0 0 0 736 1480 L732 1500 A192 40 0 0 1 348 1500 Z" fill="#0b0d10"/>
        <path d="M346 1486 A194 40 0 0 0 734 1486" fill="none" stroke="#7c8692" stroke-opacity=".5" stroke-width="3"/>
        <!-- pedal -->
        <path d="M480 1500 h120 a10 10 0 0 1 10 10 v14 a10 10 0 0 1 -10 10 h-120 a10 10 0 0 1 -10 -10 v-14 a10 10 0 0 1 10 -10z" fill="url(#lidG)"/>
        <path d="M486 1506 h108" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
        <!-- front rim -->
        <path d="M300 960 A240 50 0 0 0 780 960" fill="none" stroke="url(#rimG)" stroke-width="16"/>
        <path d="M304 966 A236 48 0 0 0 776 966" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="5"/>
        <path d="M320 958 A224 46 0 0 0 600 1008" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>

        <!-- lid (hinged at left rim) -->
        <g id="lid">
          <path d="M292 958 C300 862 780 862 788 958 A248 52 0 0 1 292 958 Z" fill="url(#lidG)"/>
          <path d="M292 958 C300 862 780 862 788 958" fill="url(#lidTop)"/>
          <path d="M292 958 A248 52 0 0 0 788 958 L788 972 A248 52 0 0 1 292 972 Z" fill="#0e1115"/>
          <path d="M294 962 A246 50 0 0 0 786 962" fill="none" stroke="url(#rimG)" stroke-width="6"/>
          <path d="M360 920 C420 884 520 878 560 880" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
          <!-- handle -->
          <path d="M478 892 C478 852 602 852 602 892" fill="none" stroke="#0c0f13" stroke-width="22" stroke-linecap="round"/>
          <path d="M478 892 C478 852 602 852 602 892" fill="none" stroke="url(#rimG)" stroke-width="12" stroke-linecap="round"/>
          <ellipse cx="478" cy="896" rx="16" ry="7" fill="#0c0f13"/><ellipse cx="602" cy="896" rx="16" ry="7" fill="#0c0f13"/>
        </g>
      </g>

      <g id="fx"></g>
    </svg>
  </div>

  <!-- ===== hand cursor ===== -->
  <div id="hand"><div class="inner" id="handInner"></div></div>
</div>
</div>

<script>
/* ============ CONFIG ============

function handTo(x,y,instant){

/* ---------- screen 1 sequence ---------- */
const cards=[0,1,2].map(i=>document.getElementById('c'+i));
const s1=document.getElementById('s1'), s2=document.getElementById('s2');
const statusText=['3 infected files','Malware detected','Trojan detected'];

function resetCards(){
  cards.forEach((c,i)=>{
    c.className='card'; c.style.opacity=''; c.style.transform='';
    c.querySelector('.st').textContent=statusText[i];
    c.querySelectorAll('.ripple').forEach(r=>r.remove());
  });
}

  const top=parseFloat(c.style.top);
  const bx=540+(Math.random()*120-60), by=top+420-48-66;
  handTo(bx,by); await sleep(820);
  hand.classList.add('tap'); const btn=c.querySelector('.btn'); btn.classList.add('press');
  const r=document.createElement('span'); r.className='ripple';
  r.style.left=(bx-80-52)+'px'; r.style.top=(by-top-(420-48-132))+'px'; btn.appendChild(r);
  await sleep(160);
  hand.classList.remove('tap'); btn.classList.remove('press');
  c.classList.remove('alert'); c.classList.add('done');
  c.querySelector('.st').textContent='Cleaned';
  await sleep(350);
}
async function scene1(){
  resetCards();
  s1.classList.remove('hidden','out');
  handTo(1180,2100,true);
  await sleep(300);
  for(const c of cards){ c.classList.add('in','alert'); await sleep(380); }
  await sleep(700);
  for(const c of cards){ await clickCard(c); }
  handTo(1200,2150); await sleep(500);
  cards.forEach((c,i)=>{ setTimeout(()=>{c.style.transform='translateY(-40px) scale(.9)';c.style.opacity='0';}, i*90); });
  await sleep(450);
  s1.classList.add('out');
}

/* ---------- screen 2: trash loop (rAF, seamless 10s) ---------- */
const NS='http://www.w3.org/2000/svg';
const ribs=document.getElementById('ribs');
for(let i=1;i<14;i++){
  const u=i/14, xt=300+480*u, xb=344+392*u;
  // curvature: ribs follow front ellipse at top
  const yt=960+50*Math.sin(Math.PI*u)-4, yb=1480+40*Math.sin(Math.PI*u);
  const d=document.createElementNS(NS,'path'); d.setAttribute('d',`M${xt} ${yt} L${xb} ${yb}`);
  d.setAttribute('stroke','#000'); d.setAttribute('stroke-opacity','.42'); d.setAttribute('stroke-width','7'); ribs.appendChild(d);
  const l=document.createElementNS(NS,'path'); l.setAttribute('d',`M${xt+6} ${yt} L${xb+5} ${yb}`);
  l.setAttribute('stroke','#fff'); l.setAttribute('stroke-opacity',(.08+.14*Math.sin(Math.PI*u*1.2)).toFixed(2)); l.setAttribute('stroke-width','3'); ribs.appendChild(l);
}

function virusSVG(fill){
  let s='';
  for(let k=0;k<12;k++){
    const a=k/12*Math.PI*2, x1=Math.cos(a)*44, y1=Math.sin(a)*44, x2=Math.cos(a)*68, y2=Math.sin(a)*68;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1d2b1a" stroke-opacity=".55" stroke-width="9" stroke-linecap="round"/>`;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="url(#${fill})" stroke-width="6" stroke-linecap="round"/>`;
    s+=`<circle cx="${x2}" cy="${y2}" r="10" fill="url(#${fill})" stroke="#000" stroke-opacity=".25" stroke-width="2"/>`;
  }
  s+=`<circle r="50" fill="url(#${fill})" stroke="#000" stroke-opacity=".25" stroke-width="3"/>`;
  s+=`<circle cx="-16" cy="-8" r="9" fill="#000" opacity=".18"/><circle cx="14" cy="14" r="12" fill="#000" opacity=".15"/><circle cx="18" cy="-20" r="6" fill="#000" opacity=".15"/><circle cx="-10" cy="22" r="5" fill="#000" opacity=".15"/>`;
  s+=`<ellipse cx="-18" cy="-24" rx="14" ry="8" fill="#fff" opacity=".55" transform="rotate(-30 -18 -24)"/>`;
  return s;
}
function paperSVG(seed){
  const pts=[]; const n=11;
  for(let k=0;k<n;k++){ const a=k/n*Math.PI*2; const r=52+((Math.sin(seed*13+k*7.3)+1)/2)*20; pts.push([Math.cos(a)*r,Math.sin(a)*r]); }
  const poly=pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  let s=`<polygon points="${poly}" fill="url(#paperG)" stroke="#9aa4b4" stroke-width="3" stroke-linejoin="round"/>`;
  for(let k=0;k<n;k+=2){ const p=pts[k]; s+=`<path d="M0 0 L${(p[0]*.85).toFixed(1)} ${(p[1]*.85).toFixed(1)}" stroke="#a7b0bf" stroke-width="2.5" fill="none"/>`; }
  s+=`<path d="M-30 -10 L-4 6 L22 -14 M-18 24 L6 8 L30 22" stroke="#b6bfcc" stroke-width="3" fill="none" stroke-linejoin="round"/>`;
  s+=`<polygon points="${pts.slice(0,4).map(p=>(p[0]*.6).toFixed(1)+','+(p[1]*.6).toFixed(1)).join(' ')} 0,0" fill="#000" opacity=".06"/>`;
  s+=`<path d="M-50 18 L-20 30 L-34 52" stroke="#a7b0bf" stroke-width="2.5" fill="none" opacity=".8"/>`;
  return s;
}

const itemsG=document.getElementById('items'), fxG=document.getElementById('fx');
const types=['v1','p','v2','p','v3','p','v1','p'];
const fills={v1:'vG1',v2:'vG2',v3:'vG3'};
const N=8, GAP=TRASH_LOOP_MS/N, FLY=1000, FALL=380;
const items=[];
for(let k=0;k<N;k++){
  const g=document.createElementNS(NS,'g'); const t=types[k];
  g.innerHTML = t==='p' ? paperSVG(k+1) : virusSVG(fills[t]);
  itemsG.appendChild(g);
  const left=k%2===0;
  items.push({g, start:k*GAP,
    p0:[left?-120:1200, left?1150+ (k%3)*60 : 1080+(k%3)*70],
    p1:[left?260:820, 260+(k%4)*50],
    p2:[540+(left?-40:40), 900],
    rot:(left?1:-1)*(420+k*40), sc: t==='p'?0.95:0.9});
  // sparkle
  const sp=document.createElementNS(NS,'g'); sp.innerHTML=
    `<circle r="40" fill="url(#sparkG)"/><path d="M0 -46 L6 -6 L46 0 L6 6 L0 46 L-6 6 L-46 0 L-6 -6Z" fill="#fff"/>`;
  sp.style.opacity=0; fxG.appendChild(sp); items[k].sp=sp;
}
const lid=document.getElementById('lid'), bin=document.getElementById('bin'), floorShadow=document.getElementById('floorShadow');
const ss=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
let t0=null, running=false;
function frame(now){
  if(!running) return;
  if(t0===null) t0=now;
  const t=(now-t0)%TRASH_LOOP_MS;
  let open=0, bump=0;
  for(const it of items){
    const L=(t-it.start+TRASH_LOOP_MS)%TRASH_LOOP_MS;
    const arrive=FLY;
    // lid openness window around arrival
    const dA=L-arrive;
    open=Math.max(open, ss((dA+520)/240)*(1-ss((dA-260)/240)));
    if(L<FLY){
      const u=L/FLY, e=u; // bezier
      const x=(1-e)*(1-e)*it.p0[0]+2*(1-e)*e*it.p1[0]+e*e*it.p2[0];
      const y=(1-e)*(1-e)*it.p0[1]+2*(1-e)*e*it.p1[1]+e*e*it.p2[1];
      it.g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(it.rot*u).toFixed(1)}) scale(${it.sc})`);
      it.g.style.opacity=1;
    } else if(L<FLY+FALL){
      const u=(L-FLY)/FALL;
      const y=it.p2[1]+u*u*300, x=it.p2[0]+(540-it.p2[0])*u;
      it.g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(it.rot+u*120).toFixed(1)}) scale(${(it.sc*(1-u*.25)).toFixed(3)})`);
      it.g.style.opacity=1;
    } else { it.g.style.opacity=0; }
    // impact
    const dI=L-(FLY+FALL*0.5);
    if(dI>0 && dI<700){ bump=Math.max(bump, Math.exp(-dI/180)*Math.sin(dI/45)); }
    // sparkle
    const dS=L-FLY-60;
    if(dS>0 && dS<500){ const u=dS/500; it.sp.style.opacity=(1-u)*.95;
      it.sp.setAttribute('transform',`translate(${540+(it.p2[0]>540?70:-70)} ${880-u*60}) scale(${0.5+u*0.9}) rotate(${u*90})`);
    } else it.sp.style.opacity=0;
  }
  lid.setAttribute('transform',`rotate(${(-62*open).toFixed(2)} 292 958)`);
  const sq=bump*0.025;
  bin.setAttribute('transform',`translate(540 1500) scale(${(1+sq).toFixed(4)} ${(1-sq).toFixed(4)}) translate(-540 -1500)`);
  floorShadow.setAttribute('rx',(300*(1+sq*1.5)).toFixed(1));
  requestAnimationFrame(frame);
}
async function scene2(){
  s2.classList.remove('hidden'); s2.offsetHeight; s2.classList.add('show');
  t0=null; running=true; requestAnimationFrame(frame);
  await sleep(TRASH_LOOP_MS);
  s2.classList.remove('show'); s2.classList.add('hidden');
  await sleep(600); running=false;
}

(async function loop(){
  while(true){
    await scene1();
    await sleep(250);
    s1.classList.add('hidden');
    await scene2();
  }
})();
